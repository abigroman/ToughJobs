<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toughjobs — Powerful Marketing for the Trades | Peoria, IL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Russo+One&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:#000000;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  :root{
    --ink:#0A0F1C;
    --navy:#002768;
    --navy-2:#001a4a;
    --red:#C8262A;
    --red-2:#A90100;
    --smoke:#5B6471;
    --mute:#C7CBD2;
    --mute-2:#E5E7EB;
    --hairline:#E5E7EB;
    --surface-alt:#F4F5F7;
    --surface:#FCFCFD;
    --white:#FFFFFF;

    /* role tokens — overridden by palette tweak */
    --bg-dark: var(--ink);
    --accent: var(--red);
    --accent-ink: var(--white);
    --headline-a: var(--ink);
    --headline-b: var(--accent);
    --headline-mute: var(--mute);

    --container: 1240px;
    --pad-section: 112px;
    --pad-section-tight: 80px;
  }
  body[data-density="compact"]{ --pad-section: 80px; --pad-section-tight: 56px; }

  .display{
    font-family:"Archivo Black","Archivo",ui-sans-serif,system-ui,sans-serif;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-0.01em;
    line-height:.95;
    text-wrap:balance;
  }
  .eyebrow{
    font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:12px;
  }
  .container{
    max-width:var(--container);
    margin:0 auto;
    padding:0 32px;
  }
  section{ padding-block:var(--pad-section); }

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:16px 26px;
    font-family:"Archivo",sans-serif;font-weight:800;letter-spacing:.06em;
    font-size:13px;text-transform:uppercase;text-decoration:none;
    background:var(--accent);color:var(--accent-ink);
    border:0;cursor:pointer;
    transition:transform .15s ease, filter .2s ease, background .2s ease;
  }
  .btn:hover{ filter:brightness(.92); }
  .btn:active{ transform:translateY(1px); }
  .btn-dark{ background:var(--ink); color:var(--white); }
  .btn-ghost{
    background:transparent; color:var(--ink);
    border:2px solid var(--ink);
    padding:14px 24px;
  }
  .btn-ghost:hover{ background:var(--ink); color:var(--white); }

  /* Two-tone split headline */
  .split .a{ color:var(--headline-a); }
  .split .b{ color:var(--headline-b); }
  .split .m{ color:var(--headline-mute); }

  /* Headline style variants */
  [data-headline="solid"] .b{ color:var(--headline-a); }
  [data-headline="solid"] .m{ color:var(--headline-a); }
  [data-headline="outlined"] .b{
    color:transparent;
    -webkit-text-stroke:2px var(--headline-b);
  }
  [data-headline="outlined"] .m{
    color:transparent;
    -webkit-text-stroke:2px var(--headline-mute);
  }

  /* Diagonal section dividers — uniform 40px max, slight tilt */
  .chev-top{
    clip-path: polygon(0 40px, 100% 0, 100% 100%, 0 100%);
  }
  .chev-bot{
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 40px), 0 100%);
  }
  body[data-chevrons="false"] .chev-top,
  body[data-chevrons="false"] .chev-bot{ clip-path:none; }

  /* Marquee */
  @keyframes marq { from{ transform:translateX(0) } to { transform:translateX(-50%) } }
  .marquee-track{
    display:flex; gap:80px; white-space:nowrap;
    animation: marq 40s linear infinite;
  }

  /* Hover lift on cards */
  .lift{ transition: transform .25s ease, box-shadow .25s ease; }
  .lift:hover{ transform: translateY(-4px); }

  /* Hide tweaks visual when off */
  .controls-tab{
    position:fixed;left:0;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:top left;
    background:var(--ink);color:var(--white);
    font-family:"Archivo",sans-serif;font-weight:800;letter-spacing:.12em;font-size:11px;
    padding:8px 14px;z-index:50;text-transform:uppercase;pointer-events:none;
  }

  /* For dark sections to inherit white text reliably */
  .on-dark{ color:var(--white); }
  .on-dark .display{ color:var(--white); }
  .on-dark .eyebrow{ color:var(--white); opacity:.85; }
  .on-dark p{ color:rgba(255,255,255,.78); }

  /* Hairline */
  .hairline{ border-top:1px solid var(--hairline); }

  /* Striped placeholder */
  .placeholder{
    position:relative;
    background-image:
      repeating-linear-gradient(135deg, rgba(0,0,0,.06) 0 1px, transparent 1px 14px),
      linear-gradient(180deg, #ECEEF2 0%, #DDE1E7 100%);
    color:#3B4250;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .placeholder.dark{
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 1px, transparent 1px 14px),
      linear-gradient(180deg, #20262F 0%, #0E1219 100%);
    color:rgba(255,255,255,.55);
  }
  .placeholder .meta{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    background:rgba(0,0,0,.06); padding:6px 10px; backdrop-filter: blur(2px);
  }
  .placeholder.dark .meta{ background:rgba(255,255,255,.06); }

  /* Section label */
  [data-screen-label]{ scroll-margin-top:80px; }

  /* Print/edit niceties */
  ::selection{ background:var(--accent); color:var(--accent-ink); }
</style>
</head>
<body>
